  <!-- ==========================================================================
       2. AUTO-LOADERS   (pull projects from GitHub and posts from DEV.to)
       Settings live in SITE.github / SITE.devto above. If a source is
       switched off or fails, the manual FALLBACK lists are used instead.
       ========================================================================== -->
  <script>
    let PROJECTS = FALLBACK_PROJECTS;
    let BLOGS = FALLBACK_BLOGS;

    const CACHE_MINUTES = 10;   // avoids hammering the APIs on every page load

    const esc = (t = '') => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /** Returns cached data if it's fresh, otherwise runs `loader` and caches the result. */
    async function cached(key, loader) {
      try {
        const hit = JSON.parse(localStorage.getItem(key));
        if (hit && Date.now() - hit.time < CACHE_MINUTES * 60000) return hit.data;
      } catch {}
      const data = await loader();
      if (Array.isArray(data) && data.length) {
        try { localStorage.setItem(key, JSON.stringify({ time: Date.now(), data })); } catch {}
      }
      return data;
    }

    /** fetch() that gives up after 8 seconds, so a slow or blocked service can never freeze the page */
    const timedFetch = (url, opts = {}, ms = 8000) => {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), ms);
      return fetch(url, { ...opts, signal: ctl.signal })
        .catch(e => { throw new Error(e.name === 'AbortError' ? `${new URL(url).hostname} took too long to respond` : `${new URL(url).hostname} could not be reached`); })
        .finally(() => clearTimeout(timer));
    };

    const LOAD_ERRORS = {};
    const LOADING = { github: false, devto: false };   // reasons a section is empty (shown on the page so you can see what went wrong)

    const formatDate = (d) => isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    /** GitHub → project cards (most recently pushed first). count: 0 = ALL repos */
    async function fetchGithubProjects({ username, count, skipForks }) {
      const res = await timedFetch(`https://api.github.com/users/${username}/repos?sort=pushed&per_page=100`);
      if (!res.ok) throw new Error(`GitHub responded ${res.status}` + (res.status === 403 ? ' (rate limit, try again later)' : ''));
      const repos = await res.json();
      return repos
        .filter(r => !(skipForks && r.fork) && r.name.toLowerCase() !== username.toLowerCase())
        .slice(0, count || undefined)
        .map(r => ({
          title: esc(r.name.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase())),
          category: esc(r.language || 'Repository'),
          description: esc(r.description || 'No description yet. Have a look at the code on GitHub!'),
          tags: (r.topics && r.topics.length ? r.topics : [r.language].filter(Boolean)).slice(0, 3).map(esc),
          link: r.html_url,
        }));
    }

    /** DEV.to's public API returns article details when you fetch a single post by slug or id. */
    async function fetchDevToArticle({ slug, id }) {
      const key = id || slug;
      if (key === undefined || key === null || key === '') throw new Error('No DEV.to article key provided');

      const url = `https://dev.to/api/articles/${encodeURIComponent(String(key))}`;
      const res = await timedFetch(url);
      if (!res.ok) throw new Error(`DEV.to responded ${res.status}`);
      const article = await res.json();
      if (!article || typeof article !== 'object') throw new Error('DEV.to returned an invalid article response');

      const articleUrl = new URL(article.url || `https://dev.to/${article.username || SITE.devto.username}/${article.slug}`);
      if (articleUrl.protocol !== 'https:' || articleUrl.hostname !== 'dev.to') {
        throw new Error('DEV.to returned an invalid article URL');
      }

      return {
        id: article.id,
        slug: article.slug,
        title: esc(article.title),
        date: formatDate(new Date(article.published_at)),
        readTime: `${Math.max(1, Number(article.reading_time_minutes) || 1)} min read`,
        snippet: esc(article.description || 'Read the full article on DEV.to.'),
        tags: Array.isArray(article.tag_list) ? article.tag_list.slice(0, 3).map(esc) : [],
        url: articleUrl.href,
        content: article.body_html || '',
      };
    }

    /** DEV.to's public API returns the latest published articles for a username. */
    async function fetchDevToPosts({ username, count }) {
      const params = new URLSearchParams({ username, per_page: '100' });
      const url = `https://dev.to/api/articles?${params}`;
      const res = await timedFetch(url);
      if (!res.ok) throw new Error(`DEV.to responded ${res.status}`);
      const articles = await res.json();
      if (!Array.isArray(articles)) throw new Error('DEV.to returned an invalid articles response');
      return articles
        .slice(0, count || undefined)
        .map(article => {
          const articleUrl = new URL(article.url);
          if (articleUrl.protocol !== 'https:' || articleUrl.hostname !== 'dev.to') {
            throw new Error('DEV.to returned an invalid article URL');
          }
          return {
            id: article.id,
            slug: article.slug,
            title: esc(article.title),
            date: formatDate(new Date(article.published_at)),
            readTime: `${Math.max(1, Number(article.reading_time_minutes) || 1)} min read`,
            snippet: esc(article.description || 'Read the full article on DEV.to.'),
            tags: Array.isArray(article.tag_list) ? article.tag_list.slice(0, 3).map(esc) : [],
            url: articleUrl.href,
            content: '',
          };
        });
    }

    /** Loads GitHub + DEV.to in the background. The page shows immediately and updates as each one arrives. */
    function loadRemoteContent() {
      const { github, devto } = SITE;

      const load = async (key, enabled, cacheKey, loader, apply, emptyMsg) => {
        if (!enabled) return;
        LOADING[key] = true;
        try {
          const data = await cached(cacheKey, loader);
          if (data.length) apply(data); else LOAD_ERRORS[key] = emptyMsg;
        } catch (e) {
          LOAD_ERRORS[key] = e?.message || String(e);
          console.warn(`${key} load failed:`, e);
        } finally {
          LOADING[key] = false;
          route(false);   // re-draw the current page without jumping to the top
        }
      };

      load('github', !!github.username, `gh:${github.username}:${github.count}:${github.skipForks}`,
           () => fetchGithubProjects(github), d => { PROJECTS = d; }, 'No public repositories found for this username.');
      load('devto', !!devto.username, `devto:${devto.username}:${devto.count}`,
           () => fetchDevToPosts(devto), d => { BLOGS = d; }, 'No published posts found on this DEV.to profile.');
    }
  </script>

            <a href="${postLink}" class="text-stone-900 font-medium text-sm inline-flex items-center gap-1 hover-underline pb-0.5">
              Read article ${icon('arrow', 'transition-transform group-hover:translate-x-1')}
            </a>
            <a href="${esc(b.url)}" target="_blank" rel="noopener" class="text-stone-500 font-medium text-sm inline-flex items-center gap-1 hover:text-stone-900 hover-underline pb-0.5">
              Open on DEV.to ${icon('external', 'inline')}
            </a>
          </div>
        </article>`;
    };

    /** All social links + email, in display order (used in Home and footer) */
    const allSocials = () => [...PROFILE.socials, { name: 'Email', url: `mailto:${PROFILE.email}` }];

    /** Friendly message shown if a list is empty (e.g. the GitHub / DEV.to request failed) */
    const emptyNote = (what, url, label, reason) =>
      `<p class="md:col-span-2 text-stone-500">Couldn't load ${what} right now. <a href="${url}" target="_blank" rel="noopener" class="text-stone-900 hover-underline pb-0.5">${label}</a>
        ${reason ? `<span class="block text-xs text-stone-400 mt-1">Reason: ${esc(reason)}</span>` : ''}</p>`;
    const loadingNote = (what) => `<p class="md:col-span-2 text-stone-400">Loading ${what}…</p>`;
    const noProjects = () => LOADING.github ? loadingNote('projects') : emptyNote('projects', `https://github.com/${SITE.github.username}`, 'See them on GitHub →', LOAD_ERRORS.github);
    const noPosts = () => LOADING.devto ? loadingNote('posts') : emptyNote('posts', `https://dev.to/${SITE.devto.username}`, 'Read them on DEV.to →', LOAD_ERRORS.devto);

    const resumeLabel = (text) =>
      `<h2 class="text-xs uppercase tracking-widest text-stone-400 font-semibold mb-6">${text}</h2>`;
  </script>


  <!-- ==========================================================================
       4. VIEWS   (one function per page)
       ========================================================================== -->
  <script>
    async function loadDevToPostDetail(postKey) {
      const key = decodeURIComponent(postKey || '').trim();
      if (!key) return;

      const target = BLOGS.find(post => String(post.id) === key || post.slug === key);
      if (!target) return;
      if (target.content) return;

      try {
        const article = await fetchDevToArticle({ slug: target.slug, id: target.id });
        BLOGS = BLOGS.map(post => {
          if (String(post.id) === String(article.id) || post.slug === article.slug) {
            return { ...post, ...article };
          }
          return post;
        });
        route(false);
      } catch (e) {
        LOAD_ERRORS.devto = e?.message || String(e);
        const fallbackUrl = target.url || `https://dev.to/${SITE.devto.username}`;
        BLOGS = BLOGS.map(post => post.id === target.id ? {
          ...post,
          content: `<p class="text-stone-600">Unable to load this article preview right now. <a href="${fallbackUrl}" target="_blank" rel="noopener" class="text-stone-900 hover-underline pb-0.5">Read it on DEV.to</a></p>`
        } : post);
        route(false);
      }
    }

    const VIEWS = {

      home() {
        const projects = PROJECTS.slice(0, SITE.homeProjectCount).map(p => projectCard(p)).join('');
        const blogs = BLOGS.slice(0, SITE.homeBlogCount).map(b => blogCard(b)).join('');

        return `
          <div class="max-w-4xl mx-auto animate-fade-in mt-12 md:mt-20">

            <section class="mb-24">
              <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-stone-900 mb-6 leading-tight">
                Hi, I'm ${PROFILE.name}.<br>
                <span class="text-stone-400 font-normal">${PROFILE.title}</span>
              </h1>
              ${PROFILE.tagline ? `<p class="text-xl md:text-2xl text-stone-600 leading-relaxed font-serif mb-8">${PROFILE.tagline}</p>` : ''}
              <p class="text-lg text-stone-600 leading-relaxed mb-10 max-w-2xl">${PROFILE.about}</p>
              <div class="flex flex-wrap items-center gap-6">
                <a href="${RESUME.pdfLink}" target="_blank" rel="noopener" class="inline-flex items-center justify-center px-6 py-3 bg-stone-900 text-stone-50 font-medium rounded-md hover:bg-stone-800 transition-colors shadow-sm">View Resume</a>
                <a href="mailto:${PROFILE.email}" class="inline-flex items-center gap-2 text-stone-900 font-medium hover:opacity-70 transition-opacity">Say hello ${icon('arrow')}</a>
              </div>
            </section>

            ${divider()}

            <section class="mb-24">
              ${sectionHeader(SITE.text.homeProjects, '#projects', 'View all projects')}
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${projects || noProjects()}</div>
            </section>

            ${divider()}

            <section>
              ${sectionHeader(SITE.text.homeBlog, '#blog', 'View all posts')}
              <p class="mb-6 text-sm text-stone-500">
                <a href="https://dev.to/${SITE.devto.username}" target="_blank" rel="noopener" class="hover:text-stone-900 hover-underline pb-0.5">Visit my DEV.to profile ${icon('external', 'inline')}</a>
              </p>
              <div class="max-w-3xl">${blogs || noPosts()}</div>
            </section>
          </div>`;
      },

      projects() {
        return `
          <div class="max-w-5xl mx-auto animate-fade-in mt-8">
            ${pageHeader(SITE.text.projectsPage)}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${PROJECTS.map(p => projectCard(p, true)).join('') || noProjects()}</div>
          </div>`;
      },

      resume() {
        const skills = RESUME.skills.map(s => `
          <div class="mb-6">
            <h4 class="text-sm font-semibold text-stone-900 mb-2">${s.category}</h4>
            <p class="text-sm text-stone-600 leading-relaxed">${s.items}</p>
          </div>`).join('');

        const education = RESUME.education.map(e => `
          <div class="mb-8">
            <div class="md:flex justify-between items-baseline mb-2">
              <h3 class="text-base font-semibold text-stone-900">${e.degree}</h3>
              <span class="text-sm text-stone-400 font-medium">${e.period}</span>
            </div>
            <h4 class="text-stone-500 text-sm">${e.institution}</h4>
          </div>`).join('');

        const experience = RESUME.experience.map(x => `
          <div class="mb-12">
            <div class="md:flex justify-between items-baseline mb-2">
              <h3 class="text-lg font-semibold text-stone-900">${x.role}</h3>
              <span class="text-sm text-stone-400 font-medium block md:inline mt-1 md:mt-0">${x.period}</span>
            </div>
            <h4 class="text-stone-500 font-medium mb-4">${x.company}</h4>
            <p class="text-stone-600 text-sm leading-relaxed">${x.description}</p>
          </div>`).join('');

        return `
          <div class="max-w-3xl mx-auto animate-fade-in mt-8">
            <header class="mb-16">
              <div class="flex justify-between items-end mb-4">
                <h1 class="text-3xl font-bold tracking-tight text-stone-900">${SITE.text.resumePage.title}</h1>
                <a href="${RESUME.pdfLink}" target="_blank" class="text-sm font-medium text-stone-500 hover:text-stone-900 hover-underline pb-0.5 inline-flex items-center gap-2">
                  Download PDF ${icon('download')}
                </a>
              </div>
              <p class="text-stone-600 font-serif text-lg leading-relaxed">${RESUME.summary}</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
              <div class="md:col-span-1 order-2 md:order-1">
                <section class="mb-12">${resumeLabel('Skills')}${skills}</section>
                <section>${resumeLabel('Education')}${education}</section>
              </div>
              <div class="md:col-span-2 order-1 md:order-2">
                <section>${resumeLabel('Work History')}${experience}</section>
              </div>
            </div>
          </div>`;
      },

      blog() {
        return `
          <div class="max-w-3xl mx-auto animate-fade-in mt-8">
            ${pageHeader(SITE.text.blogPage)}
            <p class="mb-10 -mt-10 text-sm">
              <a href="https://dev.to/${SITE.devto.username}" target="_blank" rel="noopener" class="text-stone-500 hover:text-stone-900 hover-underline pb-0.5">Visit my DEV.to profile ${icon('external', 'inline')}</a>
            </p>
            <div class="mt-8">${BLOGS.map(b => blogCard(b, true)).join('') || noPosts()}</div>
          </div>`;
      },

      post(id) {
        const key = decodeURIComponent(id || '').trim();
        const b = BLOGS.find(post => String(post.id) === key || post.slug === key);
        if (!b) return `
          <div class="max-w-3xl mx-auto text-center mt-24">
            <h1 class="text-2xl font-bold text-stone-900 mb-4">Article not found.</h1>
            <a href="#blog" class="text-stone-500 hover:text-stone-900 hover-underline pb-0.5">Back to writing</a>
          </div>`;

        if (!b.content) {
          loadDevToPostDetail(key);
          return `
            <div class="max-w-2xl mx-auto animate-fade-in mt-4 md:mt-8">
              <a href="#blog" class="inline-flex items-center gap-2 text-stone-400 hover:text-stone-900 transition-colors mb-12 text-sm font-medium">
                ${icon('back')} Back to Writing
              </a>
              <article>
                <header class="mb-12">
                  <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-stone-900 mb-6 leading-tight">${b.title}</h1>
                  <div class="flex items-center gap-3 text-stone-400 text-sm font-medium uppercase tracking-wider">
                    <time>${b.date}</time><span>&middot;</span><span>${b.readTime}</span>
                  </div>
                </header>
                <div class="prose w-full max-w-none text-lg font-serif">
                  <p class="text-stone-500">Loading article preview…</p>
                </div>
              </article>
            </div>`;
        }

        return `
          <div class="max-w-2xl mx-auto animate-fade-in mt-4 md:mt-8">
            <a href="#blog" class="inline-flex items-center gap-2 text-stone-400 hover:text-stone-900 transition-colors mb-12 text-sm font-medium">
              ${icon('back')} Back to Writing
            </a>
            <article>
              <header class="mb-12">
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-stone-900 mb-6 leading-tight">${b.title}</h1>
                <div class="flex items-center gap-3 text-stone-400 text-sm font-medium uppercase tracking-wider">
                  <time>${b.date}</time><span>&middot;</span><span>${b.readTime}</span>
                </div>
              </header>
              <div class="prose w-full max-w-none text-lg font-serif">${b.content}</div>
            </article>
            ${b.url ? `<p class="mt-16 text-center text-sm"><a href="${b.url}" target="_blank" rel="noopener" class="text-stone-500 hover:text-stone-900 hover-underline pb-0.5">Read on DEV.to ${icon('external', 'inline')}</a></p>` : ''}
            <div class="mt-12 w-12 h-px bg-stone-300 mx-auto"></div>
          </div>`;
      },
    };
  </script>


  <!-- ==========================================================================
       5. ROUTER & BOOTSTRAP   (you shouldn't need to touch this)
       ========================================================================== -->
  <script>
    const app = document.getElementById('app');

    function renderChrome() {
      document.getElementById('footer-name').textContent = PROFILE.name;
      document.getElementById('footer-year').textContent = new Date().getFullYear();

      document.getElementById('nav-links').innerHTML = SITE.nav.map(n =>
        `<a href="#${n.route}" data-route="${n.route}" class="hover:text-stone-900 transition-colors pb-1">${n.label}</a>`
      ).join('');

      document.getElementById('footer-socials').innerHTML = allSocials().map(s =>
        `<a href="${s.url}" target="_blank" rel="noopener" class="hover:text-stone-900 transition-colors hover-underline pb-0.5">${s.name}</a>`
      ).join('');
    }

    function route(scrollTop = true) {
      const hash = location.hash || '#home';
      const [page, param] = hash.slice(1).split('/');   // "#post/my-id" → ["post", "my-id"]
      const view = VIEWS[page] ? page : 'home';

      app.innerHTML = VIEWS[view](param);

      // Highlight active nav link (blog posts count as "blog")
      const activeRoute = view === 'post' ? 'blog' : view;
      document.querySelectorAll('#nav-links a').forEach(a =>
        a.classList.toggle('nav-active', a.dataset.route === activeRoute)
      );

      if (scrollTop) window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function initThemeToggle() {
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.info('Portfolio build 2026-09-30 v7');
      renderChrome();
      initThemeToggle();
      window.addEventListener('hashchange', () => route());
      loadRemoteContent();   // starts in the background
      route();               // page appears straight away
    });
  </script>
</body>
</html>
